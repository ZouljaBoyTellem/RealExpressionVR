[OSC]
; Set to false to disable the OSC listener.
bEnabled = true

; UDP port to listen on. Steam Link and VRCFaceTracking both send to port 9000 by default.
iPort = 9000

; Address to listen on. 127.0.0.1 only accepts data from this PC.
; Use 0.0.0.0 to accept data from other devices on your network (e.g. a phone or standalone headset).
sBindAddress = 127.0.0.1

[Face]
; Apply face tracking to the player every N frames. 1 = every frame (smoothest),
; higher = less CPU but steppier motion. At 90 fps, 10 means about 9 updates per second.
iUpdateInterval = 10

; ---------------------------------------------------------------------------------------------
; Face tracking -> Skyrim slider mappings.
; Each value is a scale: slider = clamp(tracker value * scale, 0, 1).
;   1.0 = as tracked, >1.0 = exaggerate weak movements, 0 = disable that mapping.
; When a slider has two sources (e.g. left and right eye), the larger one is used.
; ---------------------------------------------------------------------------------------------

[Modifier]
; EyesClosedL
fBlinkLeft = 1.0
; EyesClosedR
fBlinkRight = 1.0
; BrowLowererL
fBrowDownLeft = 1.0
; BrowLowererR
fBrowDownRight = 1.0
; InnerBrowRaiserL, OuterBrowRaiserL
fBrowUpLeft = 1.0
; InnerBrowRaiserR, OuterBrowRaiserR
fBrowUpRight = 1.0
; EyesLookDownL, EyesLookDownR
fLookDown = 1.0
; EyesLookLeftL, EyesLookLeftR
fLookLeft = 1.0
; EyesLookRightL, EyesLookRightR
fLookRight = 1.0
; EyesLookUpL, EyesLookUpR
fLookUp = 1.0
; LidTightenerL
fSquintLeft = 1.0
; LidTightenerR
fSquintRight = 1.0

[Phoneme]
; JawDrop
fAah = 1.0
; LipPressorL, LipPressorR
fBMP = 1.0
; LipPuckerL, LipPuckerR
fOohQ = 1.0
; TongueTipAlveolar
fDST = 1.0
; TongueTipInterdental
fTh = 1.0
; BackDorsalVelar
fK = 1.0

; --- Guesses: no tracker value clearly matches these. Set bEnable<Name> = false to hand the
; --- slider back to the game, or tune it with f<Name> like the others.

; JawDrop (same source as Aah, so both open the mouth together)
bEnableBigAah = true
fBigAah = 1.0
; FrontDorsalPalate (front of tongue raised toward the palate)
bEnableChJSh = true
fChJSh = 1.0
; LipStretcherL, LipStretcherR (lips pulled wide)
bEnableEee = true
fEee = 1.0
; LipSuckLB, LipSuckRB (lower lip pulled in)
bEnableFV = true
fFV = 1.0
; TongueTipAlveolar (same source as DST, so both move together)
bEnableN = true
fN = 1.0
; LipFunnelerLB, LipFunnelerLT, LipFunnelerRB, LipFunnelerRT (lips funneled outward)
bEnableOh = true
fOh = 1.0
; LipPuckerL, LipPuckerR (same source as OohQ)
bEnableW = true
fW = 1.0

[Expression]
; LipCornerPullerL, LipCornerPullerR (smile). A guess: Skyrim has no smile slider, so this
; drives the whole-face happy mood, which also changes the brows and eyes.
bEnableMoodHappy = true
fMoodHappy = 1.0
; LipCornerDepressorL, LipCornerDepressorR (mouth corners pulled down). A guess, as above.
bEnableMoodSad = true
fMoodSad = 1.0
; NoseWrinklerL, NoseWrinklerR. A guess, as above.
bEnableMoodDisgusted = true
fMoodDisgusted = 1.0

; Only the strongest mood is shown at a time. If one mood keeps winning when it shouldn't,
; lower its scale rather than raising the others.

; Not mapped, because Skyrim has no clear equivalent:
;   Modifier BrowInLeft/Right ........ no tracker value for brows pulling together
;   Modifier HeadPitch/Roll/Yaw ...... head pose isn't in the face data
;   Phoneme Eh, I, R ................. no tracker value comes close
;   Expression (other moods) ......... need combinations of several tracker values
;   Tracker values with nowhere to go: CheekPuff, CheekSuck, CheekRaiser, Dimpler, ChinRaiser,
;     JawSideways, JawThrust, MouthLeft/Right, LipsToward, LipTightener, LipSuckLT/RT,
;     UpperLipRaiser, LowerLipDepressor, UpperLidRaiser, TongueOut, TongueRetreat,
;     MidDorsalPalate
